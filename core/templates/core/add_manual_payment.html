<!DOCTYPE html>
<html>
<head>
    <title>Add Payment</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
        }

        .box {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Add Cash / Online Payment</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Customer</label>
        <select name="customer" required>
            {% for c in customers %}
                <option value="{{ c.id }}">
                    {{ c.name }} ({{ c.phone }})
                </option>
            {% endfor %}
        </select>

        <label>Month</label>
        <select name="month" required>
            {% for m, mname in month_choices %}
                <option value="{{ m }}">{{ mname }}</option>
            {% endfor %}
        </select>

        <label>Year</label>
        <input type="number" name="year" value="2026" required>

        <label>Payment Method</label>
        <select name="payment_method">
            <option value="Cash">Cash</option>
            <option value="PhonePe">PhonePe</option>
            <option value="GPay">GPay</option>
            <option value="UPI">UPI</option>
            <option value="Bank">Bank</option>
        </select>

        <label>Amount</label>
        <input type="number" step="0.01" name="amount" required>

        <button type="submit">Save Payment</button>
    </form>
</div>

</body>
</html>
