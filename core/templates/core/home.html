<!DOCTYPE html>
<html>
<head>
    <title>Pradeep News Agency</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f8fafc;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(135deg, #1e3a8a, #16a34a);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .box {
            max-width: 800px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 14px 22px;
            background: white;
            color: #1e3a8a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="box">
        <h1>📰 Pradeep News Agency</h1>
        <p>Newspaper billing, delivery tracking and customer payment system.</p>

        <a href="/admin-login/" class="btn">Admin Login</a>
        <a href="/customer-login/" class="btn">Customer Login</a>
    </div>
</div>

</body>
</html>
